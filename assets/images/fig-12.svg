<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#f4f6f9"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="42" y="55" font-size="17" fill="#126d79">证明有据 / 图 12</text>
<text x="42" y="105" font-size="31" font-weight="bold" fill="#152c46">可复查的证明工程</text>
<text x="42" y="143" font-size="19" fill="#536579">每次修改都需要重新建立证据链</text>
<rect x="40" y="176" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="176" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="205" font-size="17" fill="#13727c">01 / 固定输入</text>
<text x="66" y="242" font-size="24" fill="#162e47">命题、定义、工具链、依赖版本</text>
<text x="66" y="277" font-size="18" fill="#56687a">说明要证明什么，以及允许采用哪些假设。</text>
<path d="M480 303 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="321" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="321" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="350" font-size="17" fill="#13727c">02 / 构造并检查</text>
<text x="66" y="387" font-size="24" fill="#162e47">编写证明，运行编译，审计公理</text>
<text x="66" y="422" font-size="18" fill="#56687a">AI 可建议策略；检查状态不能由文字宣称代替。</text>
<path d="M480 448 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="466" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="466" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="495" font-size="17" fill="#13727c">03 / 修改与重建</text>
<text x="66" y="532" font-size="24" fill="#162e47">规格或依赖变更 → 重新检查</text>
<text x="66" y="567" font-size="18" fill="#56687a">保留日志和可复现命令，让他人能独立复查。</text>
</g></svg>
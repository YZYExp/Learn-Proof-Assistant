<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#f4f6f9"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="42" y="55" font-size="17" fill="#126d79">证明有据 / 图 04</text>
<text x="42" y="105" font-size="31" font-weight="bold" fill="#152c46">从源文件到检查结果</text>
<text x="42" y="143" font-size="19" fill="#536579">编辑器反馈与内核接受承担不同角色</text>
<rect x="40" y="176" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="176" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="205" font-size="17" fill="#13727c">01 / 编辑与解析</text>
<text x="66" y="242" font-size="24" fill="#162e47">文件、依赖、语法与名称</text>
<text x="66" y="277" font-size="18" fill="#56687a">报错可能来自版本、导入或语法，未必来自逻辑。</text>
<path d="M480 303 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="321" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="321" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="350" font-size="17" fill="#13727c">02 / 展开与构造</text>
<text x="66" y="387" font-size="24" fill="#162e47">补隐式参数，执行策略，生成证明项</text>
<text x="66" y="422" font-size="18" fill="#56687a">策略可以很复杂；其任务是提出可检查的证据。</text>
<path d="M480 448 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="466" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="466" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="495" font-size="17" fill="#13727c">03 / 内核检查</text>
<text x="66" y="532" font-size="24" fill="#162e47">检查证明项是否具有声明的类型</text>
<text x="66" y="567" font-size="18" fill="#56687a">接受结果须结合公理依赖、占位与工具链审计。</text>
</g></svg>
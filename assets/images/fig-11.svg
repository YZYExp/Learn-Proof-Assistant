<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#f4f6f9"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="42" y="55" font-size="17" fill="#126d79">证明有据 / 图 11</text>
<text x="42" y="105" font-size="31" font-weight="bold" fill="#152c46">验证编译器的保证位于何处</text>
<text x="42" y="143" font-size="19" fill="#536579">示意语义保持，不是 CompCert 的全部架构</text>
<rect x="40" y="176" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="176" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="205" font-size="17" fill="#13727c">01 / 源程序</text>
<text x="66" y="242" font-size="24" fill="#162e47">源语言形式语义中的行为</text>
<text x="66" y="277" font-size="18" fill="#56687a">源程序本身是否满足业务规格，需要另一份论证。</text>
<path d="M480 303 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="321" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="321" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="350" font-size="17" fill="#13727c">02 / 编译保持定理</text>
<text x="66" y="387" font-size="24" fill="#162e47">在定理条件下连接源与目标的行为</text>
<text x="66" y="422" font-size="18" fill="#56687a">须查看支持的语言、目标、未定义行为等具体条件。</text>
<path d="M480 448 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="466" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="466" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="495" font-size="17" fill="#13727c">03 / 目标程序与运行</text>
<text x="66" y="532" font-size="24" fill="#162e47">目标语义中的行为 → 实际执行</text>
<text x="66" y="567" font-size="18" fill="#56687a">汇编、链接、运行库、硬件等边界仍须分别说明。</text>
</g></svg>
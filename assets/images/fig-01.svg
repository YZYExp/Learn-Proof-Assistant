<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#f4f6f9"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="42" y="55" font-size="17" fill="#126d79">证明有据 / 图 01</text>
<text x="42" y="105" font-size="31" font-weight="bold" fill="#152c46">测试与证明的覆盖范围</text>
<text x="42" y="143" font-size="19" fill="#536579">观察到的样本，与带条件的全称结论</text>
<rect x="40" y="176" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="176" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="205" font-size="17" fill="#13727c">01 / 有限测试</text>
<text x="66" y="242" font-size="24" fill="#162e47">输入 0、1、2、100</text>
<text x="66" y="277" font-size="18" fill="#56687a">这些样本得到预期结果；其余输入仍需理由。</text>
<path d="M480 303 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="321" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="321" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="350" font-size="17" fill="#13727c">02 / 形式化命题</text>
<text x="66" y="387" font-size="24" fill="#162e47">∀ n : Nat, n + 0 = n</text>
<text x="66" y="422" font-size="18" fill="#56687a">全称量词覆盖该模型中的每个自然数。</text>
<path d="M480 448 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="466" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="466" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="495" font-size="17" fill="#13727c">03 / 现实边界</text>
<text x="66" y="532" font-size="24" fill="#162e47">规格、实现、运行环境</text>
<text x="66" y="567" font-size="18" fill="#56687a">证明覆盖形式模型；部署对应关系仍要核查。</text>
</g></svg>
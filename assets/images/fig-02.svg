<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#f4f6f9"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="42" y="55" font-size="17" fill="#126d79">证明有据 / 图 02</text>
<text x="42" y="105" font-size="31" font-weight="bold" fill="#152c46">命题如何成为证据</text>
<text x="42" y="143" font-size="19" fill="#536579">下面三行是逻辑结构，不是自动求解配方</text>
<rect x="40" y="176" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="176" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="205" font-size="17" fill="#13727c">01 / 合取 P ∧ Q</text>
<text x="66" y="242" font-size="24" fill="#162e47">提供 P 的证据 + Q 的证据</text>
<text x="66" y="277" font-size="18" fill="#56687a">两项都齐备，才能构造合取的证据。</text>
<path d="M480 303 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="321" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="321" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="350" font-size="17" fill="#13727c">02 / 蕴含 P → Q</text>
<text x="66" y="387" font-size="24" fill="#162e47">接收 P 的证据，返回 Q 的证据</text>
<text x="66" y="422" font-size="18" fill="#56687a">这是一个转换方法；不是说 P 已经成立。</text>
<path d="M480 448 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="466" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="466" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="495" font-size="17" fill="#13727c">03 / 全称 ∀ x, R x</text>
<text x="66" y="532" font-size="24" fill="#162e47">给任意 x，构造 R x 的证据</text>
<text x="66" y="567" font-size="18" fill="#56687a">x 必须任意，不能只挑一个方便的样本。</text>
</g></svg>
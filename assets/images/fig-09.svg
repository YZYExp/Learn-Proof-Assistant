<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#f4f6f9"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="42" y="55" font-size="17" fill="#126d79">证明有据 / 图 09</text>
<text x="42" y="105" font-size="31" font-weight="bold" fill="#152c46">规格连接输入与输出</text>
<text x="42" y="143" font-size="19" fill="#536579">例：自然数余额 balance 中扣除 amount</text>
<rect x="40" y="176" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="176" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="205" font-size="17" fill="#13727c">01 / 前置条件</text>
<text x="66" y="242" font-size="24" fill="#162e47">amount ≤ balance</text>
<text x="66" y="277" font-size="18" fill="#56687a">金额足够时，才可用扣款后的守恒式。</text>
<path d="M480 303 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="321" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="321" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="350" font-size="17" fill="#13727c">02 / 实现</text>
<text x="66" y="387" font-size="24" fill="#162e47">result = balance - amount</text>
<text x="66" y="422" font-size="18" fill="#56687a">自然数减法在零处截断；不能当作整数减法。</text>
<path d="M480 448 v14 m-5 -5 l5 5 5 -5" fill="none" stroke="#13818b" stroke-width="2"/>
<rect x="40" y="466" width="880" height="124" rx="14" fill="white" stroke="#d4dde8"/>
<rect x="40" y="466" width="8" height="124" rx="3" fill="#13818b"/>
<text x="66" y="495" font-size="17" fill="#13727c">03 / 后置条件</text>
<text x="66" y="532" font-size="24" fill="#162e47">result + amount = balance</text>
<text x="66" y="567" font-size="18" fill="#56687a">这只是纯函数规格；并发、数据库和网络需另外建模。</text>
</g></svg>
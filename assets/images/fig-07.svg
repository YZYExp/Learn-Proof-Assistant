<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#f4f6f9"/><g font-family="Noto Sans CJK SC, sans-serif">
<text x="40" y="64" font-size="30" font-weight="bold" fill="#152c46">图 07 / 归纳依靠基础与保持性</text>
<text x="40" y="105" font-size="20" fill="#536579">不能跳过 P 0，也不能把尚未证明的 P (n+1) 当作归纳假设。</text>
<rect x="65" y="360" width="150" height="75" rx="12" fill="white" stroke="#13818b" stroke-width="3"/><text x="140.0" y="405.5" text-anchor="middle" font-size="25" fill="#13818b">P 0</text>
<rect x="280" y="295" width="150" height="75" rx="12" fill="white" stroke="#13818b" stroke-width="3"/><text x="355.0" y="340.5" text-anchor="middle" font-size="25" fill="#13818b">P 1</text>
<path d="M215 397 L280 335" stroke="#8394a5" stroke-width="3" fill="none"/>
<rect x="495" y="230" width="150" height="75" rx="12" fill="white" stroke="#13818b" stroke-width="3"/><text x="570.0" y="275.5" text-anchor="middle" font-size="25" fill="#13818b">P 2</text>
<path d="M430 332 L495 270" stroke="#8394a5" stroke-width="3" fill="none"/>
<rect x="710" y="165" width="150" height="75" rx="12" fill="white" stroke="#13818b" stroke-width="3"/><text x="785.0" y="210.5" text-anchor="middle" font-size="25" fill="#13818b">P 3</text>
<path d="M645 267 L710 205" stroke="#8394a5" stroke-width="3" fill="none"/>
<text x="65" y="485" font-size="25" fill="#354d62">基础：建立 P 0</text>
<text x="65" y="530" font-size="23" fill="#354d62">保持性：对任意 n，从 P n 的证据构造 P (n+1) 的证据。</text>
<text x="65" y="575" font-size="21" fill="#354d62">台阶仅帮助理解；归纳步骤必须对任意 n 成立。</text>
</g></svg>
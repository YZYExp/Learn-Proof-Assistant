name: Publish reading site
on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'appendices/**'
      - 'assets/**'
      - 'references/**'
      - 'examples/**'
      - 'downloads/**'
      - 'book.json'
      - 'README.md'
      - 'VERIFICATION.md'
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install website dependency
        run: |
          python -m pip install --only-binary=:all: -r site/requirements.txt
      - name: Build and check reading site
        run: python scripts/build_site.py --base-path "/${GITHUB_REPOSITORY#*/}/"
      - name: Check search script
        run: node --check site/app.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy reading site
        id: deployment
        uses: actions/deploy-pages@v5
